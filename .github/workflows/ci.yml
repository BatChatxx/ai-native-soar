name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python syntax + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check (ast.parse all modules)
        run: |
          python -c "
          import ast, pathlib
          failed = []
          for f in pathlib.Path('.').rglob('*.py'):
              if '__pycache__' in str(f):
                  continue
              try:
                  ast.parse(f.read_text(encoding='utf-8'))
              except Exception as e:
                  failed.append(f'{f}: {e}')
          if failed:
              print('Syntax errors:')
              for x in failed:
                  print('  ' + x)
              raise SystemExit(1)
          print('All Python files parsed successfully')
          "

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
