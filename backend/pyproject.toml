[project]
name = "ai-native-soar-backend"
version = "1.0.0"
description = "AI-Native SOAR Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.37",
    "psycopg2-binary==2.9.10",
    "redis==5.2.1",
    "pydantic==2.10.6",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.4.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic-settings==2.8.1",
    "alembic==1.14.0",
]

[tool.setuptools]
py-modules = ["backend"]
